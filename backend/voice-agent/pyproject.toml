[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studio-voice"
version = "0.1.0"
description = "LiveKit agent runtime for Ringvi: loads an agent's settings and runs its calls"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "livekit-agents[openai,silero,langchain,deepgram,cartesia]~=1.8",
    "langchain~=1.4",
    "langchain-openai~=1.7",
    "langgraph~=1.2",
    "httpx~=0.28",
    "pydantic-settings~=2.16",
    "tzdata>=2024.1",
    "langfuse~=5.0",
    "opentelemetry-sdk~=1.45",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=7.0",
    "ruff>=0.15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
studio_voice = ["locales/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider --cov=studio_voice --cov-report=term-missing --cov-fail-under=80"
