[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studio-backend"
version = "0.1.0"
description = "Control plane API for Voice Agent Studio: agents, flows, knowledge, numbers, campaigns, calls"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi~=0.115",
    "uvicorn[standard]~=0.34",
    "pydantic-settings~=2.16",
    "sqlalchemy[asyncio]~=2.0",
    "asyncpg~=0.30",
    "alembic~=1.16",
    "redis~=5.2",
    "httpx~=0.28",
    "livekit-api~=1.2",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.0",
    "pgvector~=0.5",
    "arq~=0.28",
    "boto3~=1.43",
    "cryptography>=44",
    "langchain~=1.4",
    "langchain-openai~=1.7",
    "langchain-text-splitters~=1.1",
    "markitdown[pdf,docx,pptx,xlsx]~=0.1.9",
    "langfuse~=5.0",
    "opentelemetry-sdk~=1.45",
    "opentelemetry-instrumentation-fastapi~=0.66b2",
]

[project.optional-dependencies]
dev = [
    "aiosqlite~=0.21",
    "pyjwt>=2.8",
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=7.0",
    "ruff>=0.15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider --cov=studio_backend --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
# SQLAlchemy async runs queries in greenlets; without this, lines after an await look unrun.
concurrency = ["greenlet", "thread"]
