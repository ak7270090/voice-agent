# Full local stack: docker compose up -d --build
#   console http://localhost:3000 · API http://localhost:8000/health · storage console http://localhost:9001
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studio}
      POSTGRES_DB: ${POSTGRES_DB:-studio}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studio}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # RustFS: S3-compatible object storage (MinIO no longer publishes public images).
  storage:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-studio}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-studio-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 5s
      retries: 10

  api:
    build: ./backend/studio-backend
    env_file: .env.local
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-studio}:${POSTGRES_PASSWORD:-studio}@postgres:5432/${POSTGRES_DB:-studio}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://storage:9000
      RUNTIME_HEALTH_URL: http://runtime:8081/
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy

  # Background jobs (document ingestion): same image as the API, run by arq.
  worker:
    build: ./backend/studio-backend
    command: ["arq", "studio_backend.worker.WorkerSettings"]
    env_file: .env.local
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-studio}:${POSTGRES_PASSWORD:-studio}@postgres:5432/${POSTGRES_DB:-studio}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://storage:9000
    depends_on:
      - api

  runtime:
    build: ./backend/voice-agent
    env_file: .env.local
    environment:
      API_URL: http://api:8000
    ports:
      - "8081:8081"
    depends_on:
      - demo-clinic

  # The stand-in hospital booking API that the clinic template's tools call.
  demo-clinic:
    build: ./examples/demo-clinic
    ports:
      - "8100:8100"

  console:
    build:
      context: ./frontend/dashboard
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  storage-data:
