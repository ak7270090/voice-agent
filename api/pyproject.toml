[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studio-api"
version = "0.1.0"
description = "Control plane API for Voice Agent Studio: agents, flows, knowledge, numbers, campaigns, calls"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi~=0.115",
    "uvicorn[standard]~=0.34",
    "pydantic-settings~=2.16",
    "sqlalchemy[asyncio]~=2.0",
    "asyncpg~=0.30",
    "redis~=5.2",
    "httpx~=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=7.0",
    "ruff>=0.15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider --cov=studio_api --cov-report=term-missing --cov-fail-under=80"
